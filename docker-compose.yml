version: '3.8'

services:
  anon-connect:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: anon-connect-app
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - SECRET_KEY=${SECRET_KEY:-changeme-super-secret-key-for-production}
      - SESSION_SECRET=${SESSION_SECRET:-changeme-session-secret-for-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3002}
    volumes:
      # Mount database for persistence
      - anon-connect-data:/app/anon_connect.db
      # Mount logs for external access
      - anon-connect-logs:/app/logs
      # Mount config for runtime configuration
      - ./config:/app/config:ro
    networks:
      - anon-connect-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    labels:
      - "com.anon-connect.description=Anon-Connect Anonymous Chat Platform"
      - "com.anon-connect.version=1.0.0"

  # Redis for session storage and caching (optional but recommended for production)
  redis:
    image: redis:7-alpine
    container_name: anon-connect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-anon-connect-redis-pass}
    volumes:
      - anon-connect-redis:/data
    networks:
      - anon-connect-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (production setup)
  nginx:
    image: nginx:alpine
    container_name: anon-connect-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - anon-connect-logs:/var/log/nginx
    networks:
      - anon-connect-network
    depends_on:
      - anon-connect
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Log aggregation (optional)
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    container_name: anon-connect-logs
    restart: unless-stopped
    volumes:
      - ./fluentd/conf:/fluentd/etc
      - anon-connect-logs:/var/log/anon-connect
    networks:
      - anon-connect-network
    ports:
      - "24224:24224"
      - "24224:24224/udp"

volumes:
  anon-connect-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  anon-connect-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs
  anon-connect-redis:
    driver: local

networks:
  anon-connect-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
