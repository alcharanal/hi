<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anon-Connect - Live Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ui-enhancements.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --bg-color: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #e2e8f0;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --chat-bubble-sent: #6366f1;
            --chat-bubble-received: #f1f5f9;
            --online-color: #10b981;
            --offline-color: #64748b;
            --typing-color: #f59e0b;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-color: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-light: #64748b;
            --border-color: #334155;
            --chat-bubble-received: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .chat-container {
            display: flex;
            flex-direction: row;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-color);
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .chat-main {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .ai-insights-sidebar {
            width: 320px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .ai-insights-sidebar.collapsed {
            width: 0;
            border: none;
        }

        .ai-sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ai-sidebar-title {
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-toggle {
            position: relative;
            width: 40px;
            height: 20px;
            background: var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .ai-toggle.active {
            background: var(--primary-color);
        }

        .ai-toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .ai-toggle.active::after {
            transform: translateX(20px);
        }

        .ai-sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ai-section {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .ai-section-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Compatibility Score */
        .compatibility-score {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            border: 4px solid;
        }

        .compatibility-score.excellent {
            color: var(--success-color);
            border-color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
        }

        .compatibility-score.good {
            color: #3b82f6;
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .compatibility-score.fair {
            color: var(--warning-color);
            border-color: var(--warning-color);
            background: rgba(245, 158, 11, 0.1);
        }

        .compatibility-score.poor {
            color: var(--error-color);
            border-color: var(--error-color);
            background: rgba(239, 68, 68, 0.1);
        }

        .compatibility-component {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .component-name {
            font-size: 0.85rem;
            min-width: 80px;
            color: var(--text-secondary);
        }

        .component-bar {
            flex: 1;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .component-fill {
            height: 100%;
            background: var(--primary-color);
            transition: width 0.5s ease;
        }

        .component-value {
            font-size: 0.8rem;
            color: var(--text-secondary);
            min-width: 30px;
        }

        /* Mood Indicator */
        .mood-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mood-indicator:hover {
            background: var(--bg-tertiary);
        }

        .mood-icon {
            font-size: 2rem;
        }

        .mood-text {
            flex: 1;
        }

        .mood-primary {
            font-weight: 600;
            color: var(--text-color);
        }

        .mood-intensity {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* AI Insights */
        .ai-insight {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .ai-insight:hover {
            box-shadow: var(--shadow);
        }

        .insight-header {
            padding: 12px;
            border-left: 4px solid var(--primary-color);
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .insight-icon {
            font-size: 1.2rem;
        }

        .insight-title {
            flex: 1;
            font-weight: 600;
            color: var(--text-color);
        }

        .insight-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
            border-radius: 4px;
        }

        .insight-close:hover {
            background: var(--border-color);
            color: var(--text-color);
        }

        .insight-content {
            padding: 12px;
        }

        .insight-content p {
            margin-bottom: 8px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .insight-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .suggestion-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .suggestion-btn:hover {
            background: var(--primary-dark);
        }

        /* Topic Suggestions */
        .topic-suggestion {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            width: 100%;
        }

        .topic-suggestion:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary-color);
        }

        .suggestion-title {
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .suggestion-content {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Privacy Controls */
        .privacy-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .privacy-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .privacy-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-color);
        }

        /* Modals */
        .ai-privacy-modal,
        .mood-details-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--bg-color);
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            color: var(--text-color);
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .modal-close:hover {
            background: var(--bg-tertiary);
            color: var(--text-color);
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-primary,
        .btn-secondary {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        /* Mobile Responsiveness */
        @media (max-width: 1024px) {
            .chat-container {
                flex-direction: column;
            }

            .ai-insights-sidebar {
                width: 100%;
                height: 0;
                border-left: none;
                border-top: 1px solid var(--border-color);
                order: 2;
            }

            .ai-insights-sidebar.expanded {
                height: 300px;
            }

            .chat-main {
                order: 1;
            }
        }

        @media (max-width: 768px) {
            .ai-sidebar-content {
                padding: 12px;
            }

            .ai-section {
                padding: 12px;
            }

            .compatibility-score {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }
        }

        /* Header */
        .chat-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .partner-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .partner-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .partner-details h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .partner-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--offline-color);
            transition: background 0.3s ease;
        }

        .status-indicator.online { background: var(--online-color); }
        .status-indicator.typing { background: var(--typing-color); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-button {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .header-button:hover {
            background: var(--bg-tertiary);
            transform: translateY(-1px);
        }

        .theme-toggle {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow);
        }

        /* Chat Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-group.sent {
            align-items: flex-end;
        }

        .message-group.received {
            align-items: flex-start;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
            animation: messageSlideIn 0.3s ease-out;
        }

        .message.sent {
            background: var(--chat-bubble-sent);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.received {
            background: var(--chat-bubble-received);
            color: var(--text-color);
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .message-timestamp {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 4px;
            text-align: center;
        }

        .message.sent .message-timestamp {
            color: rgba(255, 255, 255, 0.7);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-radius: 18px;
            border-bottom-left-radius: 6px;
            max-width: 120px;
            animation: messageSlideIn 0.3s ease-out;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: typingAnimation 1.5s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        /* Connection Status */
        .connection-status {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .connection-status.searching {
            background: #fef3c7;
            color: #92400e;
            display: block;
        }

        .connection-status.connected {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .connection-status.disconnected {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        /* Message Input */
        .message-input-container {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 16px 24px;
            flex-shrink: 0;
        }

        .message-input-wrapper {
            display: flex;
            align-items: end;
            gap: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 12px 16px;
            transition: border-color 0.3s ease;
        }

        .message-input-wrapper:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .message-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-color);
            font-size: 16px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            line-height: 1.5;
        }

        .message-input::placeholder {
            color: var(--text-light);
        }

        .send-button {
            background: var(--primary-color);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.2rem;
        }

        .send-button:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Notifications */
        .notification {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            max-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left: 4px solid var(--success-color);
        }

        .notification.error {
            border-left: 4px solid var(--error-color);
        }

        .notification.warning {
            border-left: 4px solid var(--warning-color);
        }

        /* Loading States */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .loading-spinner {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .chat-header {
                padding: 12px 16px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .partner-avatar {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }

            .partner-details h3 {
                font-size: 0.9rem;
            }

            .chat-messages {
                padding: 16px;
            }

            .message {
                max-width: 85%;
            }

            .message-input-container {
                padding: 12px 16px;
            }

            .header-right {
                gap: 8px;
            }

            .header-button {
                padding: 6px 10px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .partner-info {
                gap: 8px;
            }

            .partner-details h3 {
                font-size: 0.85rem;
            }

            .partner-status {
                font-size: 0.75rem;
            }

            .message {
                max-width: 90%;
                padding: 10px 14px;
            }

            .theme-toggle {
                width: 36px;
                height: 36px;
            }
        }

        /* Animations */
        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes typingAnimation {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Scrollbar Styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--text-light);
        }

        /* Message status indicators */
        .message-status {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        .message.sent .message-status {
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="chat-container fade-in">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-left">
                <div class="logo">
                    🔒 Anon-Connect
                </div>
                <div class="partner-info" id="partner-info" style="display: none;">
                    <div class="partner-avatar" id="partner-avatar">?</div>
                    <div class="partner-details">
                        <h3 id="partner-name">Finding partner...</h3>
                        <div class="partner-status">
                            <div class="status-indicator" id="status-indicator"></div>
                            <span id="status-text">Searching...</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button class="header-button" id="ai-insights-toggle">🤖 AI</button>
                <button class="header-button" id="leave-room-btn" style="display: none;">Leave Chat</button>
                <button class="header-button" id="stats-btn">Stats</button>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
        </div>

        <!-- Connection Status -->
        <div class="connection-status" id="connection-status">
            <span id="status-message">Connecting to chat system...</span>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chat-messages">
            <div class="message-group received">
                <div class="message received">
                    <div>Welcome to Anon-Connect! 🎉</div>
                    <div class="message-timestamp">System</div>
                </div>
            </div>
            <div class="message-group received">
                <div class="message received">
                    <div>You'll be matched with another anonymous user for a private conversation. Your chat will expire in 24 hours.</div>
                    <div class="message-timestamp">System</div>
                </div>
            </div>
        </div>

        <!-- Message Input -->
        <div class="message-input-container">
            <div class="message-input-wrapper">
                <textarea 
                    class="message-input" 
                    id="message-input" 
                    placeholder="Type your message..." 
                    rows="1"
                    disabled></textarea>
                <button class="send-button" id="send-button" disabled>
                    <span>➤</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <div>Connecting to chat system...</div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <div id="notification-content"></div>
    </div>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="chat-client.js"></script>
    <script src="ai-insights.js"></script>
</body>
</html>
